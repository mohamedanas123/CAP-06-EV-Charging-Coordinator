name: Deploy CAP-06 to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Job 1: Build and Test Java Spring Boot Backend
  build-backend:
    name: Build & Test Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Test Spring Boot
        working-directory: ./evcharging
        run: |
          chmod +x mvnw
          ./mvnw clean test

  # Job 2: Build React SPA Frontend
  build-frontend:
    name: Build Frontend (React Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React SPA
        working-directory: ./frontend
        run: npm run build

  # Job 3: Deploy to AWS EC2 via SSH
  deploy-ec2:
    name: Deploy to EC2 via Docker Compose
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to EC2 and Deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # 1. Validate required GitHub Secrets
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::Missing required secret(s). Please configure EC2_HOST, EC2_USER, and EC2_SSH_KEY in repository Secrets."
            exit 1
          fi

          # 2. Setup SSH client environment
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 3. Detect and convert PuTTY (.ppk) key format if necessary
          if grep -q "PuTTY-User-Key-File" ~/.ssh/id_rsa; then
            echo "Detected PuTTY private key format. Converting to OpenSSH..."
            sudo apt-get update -qq && sudo apt-get install -y -qq putty-tools
            puttygen ~/.ssh/id_rsa -O private-openssh -o ~/.ssh/id_rsa_converted
            mv ~/.ssh/id_rsa_converted ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          fi

          # 4. Known hosts registration
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # 5. Execute deployment commands on EC2
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new "$EC2_USER@$EC2_HOST" '
            set -e
            echo "=== Step 1: Navigating to project directory ==="
            cd ~/CAP-06-EV-Charging-Coordinator

            echo "=== Step 2: Pulling latest changes from main branch ==="
            git checkout main
            git pull origin main

            echo "=== Step 3: Building and starting containers with Docker Compose ==="
            docker compose up -d --build

            echo "=== Step 4: Verifying running containers ==="
            docker compose ps
          '
